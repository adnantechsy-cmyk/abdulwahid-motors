# Abdul Wahid Motors - local development environment
# Layout:  ./backend (Laravel)  ./frontend (Next.js)  ./docker (configs)
name: awm

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: awm_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [awm]

  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: awm_app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-awm}
      DB_USERNAME: ${DB_USERNAME:-awm}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [awm]

  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: awm_queue
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-awm}
      DB_USERNAME: ${DB_USERNAME:-awm}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - app
    networks: [awm]

  mysql:
    image: mysql:8.4
    container_name: awm_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-awm}
      MYSQL_USER: ${DB_USERNAME:-awm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [awm]

  frontend:
    image: node:22-alpine
    container_name: awm_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Server-side (SSR / generateMetadata) talks to nginx over the docker network
      API_URL_INTERNAL: http://nginx/api/v1
      # Browser talks to the published port
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      - nginx
    networks: [awm]

networks:
  awm:
    driver: bridge

volumes:
  mysql_data:
  frontend_node_modules:
